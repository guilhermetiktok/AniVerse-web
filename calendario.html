<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário de Lançamentos — Aniverse</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🌸</text></svg>">
</head>
<body data-page="calendario">
<div id="loader" class="loader-screen"><div class="loader-logo">アニ<span>VERSE</span></div><div class="loader-bar"><div class="loader-fill"></div></div></div>
<header id="site-header"></header>
<main class="page container">
  <h1 class="page-title">Calendário de <span class="accent">Lançamentos</span></h1>
  <p class="page-sub">Acompanhe os animes que estão passando agora e os próximos lançamentos — com informações oficiais da Jikan API (sem horários inventados).</p>
  <div class="profile-tabs" id="cal-tabs" style="margin-bottom:24px">
    <button class="ptab on" data-mode="now">📺 Exibindo agora</button>
    <button class="ptab" data-mode="upcoming">🚀 Próximos lançamentos</button>
    <button class="ptab" data-mode="archive">📚 Temporadas anteriores</button>
  </div>
  <div id="day-tabs" class="cal-tabs" style="display:none"></div>
  <p class="result-count" id="cal-count"></p>
  <div class="cal-list" id="cal-list"><p style="color:var(--text-dim)">Carregando...</p></div>
  <div class="ad-slot" data-ad="calendario-bottom" style="margin-top:40px"><span>Espaço publicitário</span></div>
</main>
<footer id="site-footer"></footer>
<button id="back-top" class="back-top" aria-label="Voltar ao topo">↑</button>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/core.js"></script>
<script src="../js/calendario.js"></script>
</body>
</html>
