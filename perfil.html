<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Aniverse</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🌸</text></svg>">
</head>
<body data-page="login">
<div id="loader" class="loader-screen"><div class="loader-logo">アニ<span>VERSE</span></div><div class="loader-bar"><div class="loader-fill"></div></div></div>
<header id="site-header"></header>
<main class="page container">
  <div class="auth-wrap">
    <div class="form-card">
      <h1>Bem-vindo de volta 👋</h1>
      <p class="fc-sub">Entre para favoritar animes, criar listas e participar da comunidade.</p>
      <div class="form-msg" id="msg"></div>
      <button class="btn btn-google" id="btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        Entrar com Google
      </button>
      <div class="divider">ou com e-mail</div>
      <div class="form-group"><label>E-mail</label><input type="email" id="email" placeholder="seu@email.com" autocomplete="email"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn btn-primary" id="btn-login">Entrar</button>
      <button class="btn btn-ghost" id="btn-register" style="width:100%;justify-content:center;margin-top:10px;color:var(--text);border-color:rgba(139,92,246,.4)">Criar conta</button>
      <div class="auth-links">
        <a href="#" id="link-reset">Esqueci minha senha</a>
        <a href="../index.html">← Voltar ao site</a>
      </div>
    </div>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/core.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
